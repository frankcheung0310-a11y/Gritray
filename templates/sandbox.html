<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garlileo | Exploded Physical Reality Sandbox</title>
    <style>
        :root {
            --bg: #050809;
            --cyan-brand: #00f5ff;
            --accent-red: #d9383a;
            --panel-bg: rgba(10, 18, 20, 0.85);
            --border: rgba(0, 245, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #e0e6e8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
            overflow: hidden;
            height: 100vh;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* HUD 控制面板 */
        .hud-panel {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 4px;
            backdrop-filter: blur(10px);
            width: 300px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .brand-header {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        .brand-header span { color: var(--accent-red); }
        .subtitle { font-size: 0.7rem; color: #526670; text-transform: uppercase; margin-bottom: 1.5rem; }

        .upload-btn {
            display: block;
            width: 100%;
            background: rgba(0, 245, 255, 0.08);
            border: 1px dashed var(--cyan-brand);
            color: var(--cyan-brand);
            padding: 0.8rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-weight: bold;
        }
        .upload-btn:hover {
            background: rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
        }
        #file-input { display: none; }

        .status-box { margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; font-size: 0.75rem; }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 0.6rem; color: #788d96; }
        .status-value { color: var(--cyan-brand); font-weight: bold; }
        .status-value.active { color: #00ff66; }

        /* 悬浮 UI 标签结构 */
        .tech-label {
            position: absolute;
            z-index: 5;
            background: rgba(5, 10, 12, 0.85);
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.7rem;
            color: #fff;
            pointer-events: none;
            display: none;
            font-family: monospace;
            border-left: 3px solid var(--cyan-brand);
        }
        .tech-label.red-tag { border-left: 3px solid var(--accent-red); }
        .label-title { color: #526670; font-size: 0.6rem; margin-bottom: 2px; text-transform: uppercase; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-panel">
        <div class="brand-header">GA<span>R</span>LILEO</div>
        <div class="subtitle">FRICIAL PROTOCOL SANDBOX V1.0.1</div>
        
        <label class="upload-btn" for="file-input">📥 UPLOAD SURFACE IMAGE</label>
        <input type="file" id="file-input" accept="image/*">

        <div class="status-box">
            <div class="status-row"><span>Fricial Engine:</span><span id="engine-status" class="status-value">IDLE</span></div>
            <div class="status-row"><span>View Mode:</span><span class="status-value active">Explo-View Mode</span></div>
            <div class="status-row"><span>Resolution:</span><span class="status-value">128x128 Mesh</span></div>
        </div>
    </div>

    <div id="label-top" class="tech-label"><div class="label-title">Layer 01</div>Particle Velocity Flow Plane</div>
    <div id="label-mid" class="tech-label red-tag"><div class="label-title">Layer 02</div>Friction Heatmap Plane</div>
    <div id="label-bot" class="tech-label"><div class="label-title">Layer 03</div>Original RGB Texture Plane</div>

    <script>
        let scene, camera, renderer, clock;
        let layerBot, layerMid, particleSystem; 
        let boundingLines, scanLine;
        let scanAnimation = false, scanProgress = 1.0;
        let currentTexture = null;

        const analyzeCanvas = document.createElement('canvas');
        const analyzeCtx = analyzeCanvas.getContext('2d');

        function init() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050809, 0.1);

            clock = new THREE.Clock();

            // 调整摄像机视角，获得完美的斜切侧视爆炸图视角
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(2.8, -3.2, 3.0);
            camera.lookAt(0, 0, 0.2);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 光照层
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));
            let dirLight = new THREE.DirectionalLight(0x00f5ff, 0.8);
            dirLight.position.set(1, -2, 5);
            scene.add(dirLight);

            // 初始化：构建空状态下的三层框架
            buildExplodedStructure(null, null);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // ─── 核心功能：构建三层空间爆炸图 ───
        function buildExplodedStructure(texture, imgData) {
            // 清理旧对象
            if(layerBot) scene.remove(layerBot);
            if(layerMid) scene.remove(layerMid);
            if(particleSystem) scene.remove(particleSystem);
            if(boundingLines) scene.remove(boundingLines);

            const size = 2.0;

            // 1. 底层：Original RGB Texture Plane (Z = -0.4)
            const botGeo = new THREE.PlaneGeometry(size, size);
            const botMat = new THREE.MeshBasicMaterial({
                map: texture || null,
                color: texture ? 0xffffff : 0x112225,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            layerBot = new THREE.Mesh(botGeo, botMat);
            layerBot.position.z = -0.4;
            scene.add(layerBot);

            // 2. 中层：Friction Heatmap Plane + Mesh Analysis (Z = 0.1)
            // 根据图像亮度动态产生高度起伏（Bump/Elevation）
            const midGeo = new THREE.PlaneGeometry(size, size, 64, 64);
            
            // 自定义着色器：实时计算像素亮度并转换为“红/青”摩擦力场热力图
            const midMat = new THREE.ShaderMaterial({
                uniforms: {
                    uTexture: { value: texture },
                    uHasTexture: { value: texture ? 1.0 : 0.0 },
                    uScanProgress: { value: -1.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying float vElev;
                    uniform sampler2D uTexture;
                    uniform float uHasTexture;
                    void main() {
                        vUv = uv;
                        float elev = 0.0;
                        if(uHasTexture > 0.5) {
                            vec4 c = texture2D(uTexture, uv);
                            elev = (c.r + c.g + c.b) / 3.0 * 0.2; // 高度起伏
                        }
                        vElev = elev;
                        vec3 p = position;
                        p.z += elev;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    varying float vElev;
                    uniform sampler2D uTexture;
                    uniform float uHasTexture;
                    uniform float uScanProgress;
                    void main() {
                        vec3 cyan = vec3(0.0, 0.96, 1.0);
                        vec3 red = vec3(0.85, 0.22, 0.23);
                        vec4 base = vec4(0.05, 0.15, 0.18, 0.4);
                        
                        if(uHasTexture > 0.5) {
                            vec4 c = texture2D(uTexture, vUv);
                            float bright = (c.r + c.g + c.b) / 3.0;
                            // 摩擦力映射：越亮摩擦力越大（红色），越暗越滑溜（天青色）
                            vec3 heat = mix(cyan, red, bright);
                            base = vec4(heat, 0.65);
                        }
                        
                        // 扫描线霓虹特效
                        if(uScanProgress > -0.99) {
                            float d = abs(vUv.y - uScanProgress);
                            if(d < 0.02) {
                                base += vec4(0.0, 1.0, 1.0, 1.0) * (1.0 - d/0.02);
                            }
                        }
                        gl_FragColor = base;
                    }
                `,
                transparent: true,
                wireframe: texture ? false : true
            });
            layerMid = new THREE.Mesh(midGeo, midMat);
            layerMid.position.z = 0.1;
            scene.add(layerMid);

            // 3. 顶层：Particle Velocity Flow Plane (Z = 0.6)
            const pCount = 2000;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            const pUv = new Float32Array(pCount * 2);
            const pVels = new Float32Array(pCount);

            for(let i=0; i<pCount; i++) {
                let x = (Math.random() - 0.5) * size;
                let y = (Math.random() - 0.5) * size;
                pPos[i*3] = x;
                pPos[i*3+1] = y;
                pPos[i*3+2] = 0.6; // 锁死在最顶层高度面

                pUv[i*2] = (x + size/2) / size;
                pUv[i*2+1] = (y + size/2) / size;
                pVels[i] = 0.4 + Math.random() * 0.6;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            pGeo.setAttribute('uv', new THREE.BufferAttribute(pUv, 2));

            const pMat = new THREE.PointsMaterial({
                color: 0x00f5ff,
                size: 0.012,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            particleSystem = new THREE.Points(pGeo, pMat);
            particleSystem.userData = { velocities: pVels, imgData: imgData, size: size };
            scene.add(particleSystem);

            # 4. 四角全息边界连线（把三层空间串起来，瞬间产生科技工业感）
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.2 });
            const lineGeo = new THREE.BufferGeometry();
            const h = size / 2;
            const pts = [
                -h, -h, -0.4,  -h, -h, 0.6,
                 h, -h, -0.4,   h, -h, 0.6,
                 h,  h, -0.4,   h,  h, 0.6,
                -h,  h, -0.4,  -h,  h, 0.6
            ];
            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            boundingLines = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(boundingLines);
        }

        // ─── 粒子流智能阻抗减速算法 ───
        function updateParticleFlow(delta) {
            if(!particleSystem) return;
            const pos = particleSystem.geometry.attributes.position.array;
            const uvs = particleSystem.geometry.attributes.uv.array;
            const vels = particleSystem.userData.velocities;
            const imgData = particleSystem.userData.imgData;
            const size = particleSystem.userData.size;
            const count = vels.length;

            for(let i=0; i<count; i++) {
                let factor = 1.0;

                if(imgData) {
                    let u = Math.floor(uvs[i*2] * analyzeCanvas.width);
                    let v = Math.floor((1.0 - uvs[i*2+1]) * analyzeCanvas.height);
                    let idx = (v * analyzeCanvas.width + u) * 4;

                    if(idx >= 0 && idx < imgData.data.length) {
                        let brightness = (imgData.data[idx] + imgData.data[idx+1] + imgData.data[idx+2]) / 3;
                        // 核心：粒子流经过红色阻抗区时，速度暴跌 80%，形象化展示摩擦阻力
                        factor = 1.0 - (brightness / 255 * 0.8);
                    }
                }

                // 粒子由上至下流动
                pos[i*3+1] -= 0.3 * delta * vels[i] * factor;

                // 边界循环重置
                if(pos[i*3+1] < -size/2) {
                    pos[i*3+1] = size/2;
                    pos[i*3] = (Math.random() - 0.5) * size;
                }

                uvs[i*2] = (pos[i*3] + size/2) / size;
                uvs[i*2+1] = (pos[i*3+1] + size/2) / size;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // ─── 网页端图片上传并切片分析 ───
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    analyzeCanvas.width = 128;
                    analyzeCanvas.height = 128;
                    analyzeCtx.drawImage(img, 0, 0, 128, 128);
                    const imgData = analyzeCtx.getImageData(0, 0, 128, 128);

                    currentTexture = new THREE.TextureLoader().load(evt.target.result);
                    
                    // 重新构建高大上的分离三层结构
                    buildExplodedStructure(currentTexture, imgData);

                    scanAnimation = true;
                    scanProgress = 1.0;
                    document.getElementById('engine-status').innerText = "SCANNING FORCE...";
                    document.getElementById('engine-status').style.color = "#d9383a";
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ─── 3D 标签追随映射 ───
        function updateTechLabels() {
            const labels = [
                { id: 'label-top', z: 0.6 },
                { id: 'label-mid', z: 0.1 },
                { id: 'label-bot', z: -0.4 }
            ];

            labels.forEach(l => {
                const el = document.getElementById(l.id);
                if(currentTexture) {
                    // 取每层平面的右上角，计算其在 3D 空间投射到屏幕上的 2D 坐标
                    let vec = new THREE.Vector3(1.05, 0.5, l.z);
                    vec.project(camera);
                    let x = (vec.x * .5 + .5) * window.innerWidth;
                    let y = (-(vec.y * .5) + .5) * window.innerHeight;
                    el.style.left = `${x + 15}px`;
                    el.style.top = `${y}px`;
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 整个爆炸模型极其轻微地进行呼吸慢摇，立体感炸裂
            const groupRotation = Math.sin(time * 0.15) * 0.03;
            if(layerBot) layerBot.rotation.z = groupRotation;
            if(layerMid) layerMid.rotation.z = groupRotation;
            if(particleSystem) particleSystem.rotation.z = groupRotation;
            if(boundingLines) boundingLines.rotation.z = groupRotation;

            // 激光扫描行动画
            if(scanAnimation && layerMid) {
                scanProgress -= delta * 0.4;
                layerMid.material.uniforms.uScanProgress.value = scanProgress;
                if(scanProgress < 0.0) {
                    scanAnimation = false;
                    document.getElementById('engine-status').innerText = "ACTIVE";
                    document.getElementById('engine-status').style.color = "#00ff66";
                }
            }

            updateParticleFlow(delta);
            updateTechLabels();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
